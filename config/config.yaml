# 台股資料轉換器配置檔案

# 儲存設定
storage:
  # 基礎路徑
  base_path: "data/raw"

  # 檔案格式
  file_format: "json"

  # 目錄結構: "by_date" (按日期分類) 或 "aggregate" (匯總)
  directory_structure: "by_date"

  # 額外選項
  options:
    create_backup: false
    compression: false

# 驗證設定
validation:
  # 驗證失敗時的處理方式: "raise" (拋出錯誤) 或 "warn" (僅警告)
  on_validation_error: "warn"

  # 是否啟用嚴格驗證
  strict_mode: false
  
  # 驗證規則
  rules:
    price:
      required_fields: ["date", "stock_id", "close"]
      min_records: 100
    technical_analysis:
      required_fields: ["trade_date", "stock_id", "close", "ma_5"]
      min_records: 100

# 日誌設定
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# 效能設定
performance:
  # 批次處理大小
  batch_size: 100

  # 平行處理數
  max_workers: 4
