# ====================================
# PostgreSQL 資料庫服務
# ====================================
#
# 用途: 生產環境的 PostgreSQL 資料庫
# 版本: PostgreSQL 16 (Alpine Linux)
#
# 使用方式:
#   cd deployment/database/postgresql
#   docker-compose up -d
#
# 管理指令:
#   docker-compose logs -f              # 查看日誌
#   docker-compose exec postgres psql -U postgres -d tw_stock  # 連線資料庫
#   docker-compose down                 # 停止服務
#   docker-compose down -v              # 停止並刪除資料

services:
  postgres:
    image: postgres:16-alpine
    container_name: tw-stock-postgres
    restart: unless-stopped

    environment:
      # 資料庫設定
      POSTGRES_DB: ${POSTGRES_DB:-tw_stock}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}

      # 時區設定
      TZ: Asia/Taipei
      PGTZ: Asia/Taipei

      # PostgreSQL 效能調校
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # 資料持久化
      - postgres-data:/var/lib/postgresql/data

      # 初始化腳本 (按字母順序執行)
      - ../../../database/schemas/common/01-tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro
      - ../../../database/schemas/common/02-indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql:ro
      - ../../../database/schemas/postgresql/02-sequences.sql:/docker-entrypoint-initdb.d/03-sequences.sql:ro
      - ../../../database/schemas/postgresql/03-triggers.sql:/docker-entrypoint-initdb.d/04-triggers.sql:ro

      # 備份目錄
      - ../../../database/backups:/backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tw_stock}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - stock-network

    # 資源限制（生產環境建議調整）
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

volumes:
  postgres-data:
    name: tw-stock-postgres-data
    driver: local

networks:
  stock-network:
    name: ${NETWORK_NAME:-tw-stock-network}
    driver: bridge
